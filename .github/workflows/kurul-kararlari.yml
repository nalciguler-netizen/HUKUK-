name: Kurul kararlarını topla (Sigorta Tahkim, Rekabet, KVKK, Uyuşmazlık)

on:
  workflow_dispatch:
    inputs:
      yeniden:
        description: "Tüm dergi sayılarını baştan işle (1 = evet). Normalde boş bırakın."
        required: false
        default: ""
  schedule:
    - cron: "17 3,9,15,21 * * *"   # günde 4 kez: 06:17, 12:17, 18:17, 00:17 (Türkiye saati); Rekabet arşivi bitince yalnızca yeni kararlar alınır

permissions:
  contents: write

concurrency:
  group: kurul-kararlari      # aynı anda tek çalışma (elle başlatılan ile zamanlanmış çakışmasın)
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF araçlarını kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Topla
        env:
          YENIDEN: ${{ github.event.inputs.yeniden }}
        continue-on-error: true
        timeout-minutes: 160
        run: python scripts/kurul_topla.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "kurul-kararlari"
          git config user.email "yolhava.destek@gmail.com"
          git add kurul
          if git diff --cached --quiet; then echo "Yeni karar yok."; else git commit -m "Kurul kararları güncellendi" && git pull --rebase -q && git push; fi
