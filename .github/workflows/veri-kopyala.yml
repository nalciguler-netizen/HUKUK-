name: 11M karar verisini R2'ye kopyala

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "İsteğe bağlı: farklı bir Hugging Face kopyası (sahip/ad). Boş bırakın."
        required: false
        default: ""

jobs:
  kopyala:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.27,<2" "boto3>=1.34,<2"
      - name: Kopyala
        env:
          HF_REPO: ${{ github.event.inputs.hf_repo }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/copy_to_r2.py
