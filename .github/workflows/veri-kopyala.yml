name: 11M karar verisini GitHub'a kopyala

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "İsteğe bağlı: farklı bir Hugging Face kopyası (sahip/ad). Boş bırakın."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  kopyala:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.27,<2"
      - name: Kopyala
        env:
          GH_TOKEN: ${{ github.token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: python scripts/copy_to_github.py
