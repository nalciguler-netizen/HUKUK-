<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hukuk Platformu</title>
<meta name="description" content="Resmî kaynaklara dayalı hukuk araştırma ve metin analiz platformu: Yargıtay, UYAP Emsal ve Danıştay kararlarında arama, yapay zekâ ile karar özeti, sözleşme analizi ve dilekçe taslağı.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy-2:#1f3160; --gold:#c9a24b; --gold-soft:#f4ead3;
  --bg:#f7f6f2; --card:#ffffff; --text:#1d2433; --muted:#5d6678; --line:#e3e1da;
  --ok:#1f7a4d; --err:#b3261e; --radius:14px;
  --serif:"Source Serif 4", Georgia, serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1524; --card:#18213a; --text:#e8eaf0; --muted:#a3abbd; --line:#2a3555; --gold-soft:#2e2a1f; --navy-2:#273b73; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hidden{display:none!important}

/* üst bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.1rem}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:1.05rem}
.top nav{display:flex;gap:6px}
.top nav a{text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.92rem}
.top nav a.primary{background:var(--gold);color:var(--navy);font-weight:600}

/* düğmeler ve form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;text-decoration:none;min-height:46px}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.locked{opacity:.45;pointer-events:none}
.btn-block{width:100%}
label{display:block;font-size:.9rem;font-weight:500;margin:14px 0 6px}
input[type=email],input[type=password],input[type=text],input[type=url],input[type=date],input[type=number],input[type=time],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:46px}
textarea{min-height:180px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.9rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.narrow{max-width:440px;margin:28px auto}
.msg{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.93rem}
.msg.err{background:#fde8e6;color:var(--err)}
.msg.ok{background:#e2f3ea;color:var(--ok)}
@media (prefers-color-scheme: dark){ .msg.err{background:#3b1f20;color:#ffb4ab} .msg.ok{background:#173326;color:#9fe0bd} }

/* açılış */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:56px 0 64px}
.eyebrow{display:inline-block;font-size:.75rem;letter-spacing:.12em;font-weight:600;color:var(--gold);margin-bottom:14px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);max-width:720px}
.hero p{max-width:640px;color:#d7dcea;font-size:1.05rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .btn-ghost{color:#fff;border-color:#ffffff55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;max-width:620px}
.stats div{background:#ffffff12;border-radius:12px;padding:12px}
.stats b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--gold)}
.stats span{font-size:.8rem;color:#c8cfe0}
section.block{padding:44px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.feature .ico{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.2rem;margin-bottom:10px}
.feature p{margin:0;color:var(--muted);font-size:.95rem}
.trust{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plans .plan{position:relative}
.plan .price{font-family:var(--serif);font-size:2rem;font-weight:700}
.plan .price small{font-size:.9rem;font-weight:400;color:var(--muted)}
.plan ul{padding-left:18px;margin:12px 0 18px;color:var(--muted)}
.plan.featured{border:2px solid var(--gold)}
.plan .tag{position:absolute;top:-11px;right:16px;background:var(--gold);color:var(--navy);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px}
footer.site{padding:28px 0 calc(28px + env(safe-area-inset-bottom));color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
footer.site nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}

/* panel */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem}
.chips button.on{background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.searchrow{display:flex;gap:8px;margin-top:10px}
.searchrow input{flex:1}
.result{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer}
.result b{display:block;font-weight:600}
.result span{color:var(--muted);font-size:.9rem}
.doc{white-space:pre-wrap;font-family:var(--serif);font-size:1.02rem;line-height:1.7;max-height:60vh;overflow:auto;padding:16px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.out{white-space:pre-wrap;line-height:1.65}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:var(--gold)}
.notice{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:.9rem;margin:14px 0}
.legal h2{margin-top:1.4em;font-size:1.2rem}
.legal h3{margin:1.1em 0 .3em;font-size:1.05rem}
.legal p,.legal li{color:var(--text)}
.spinner{width:18px;height:18px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.btn-ghost .spinner,.btn-gold .spinner{border-color:#0002;border-top-color:currentColor}
@keyframes sp{to{transform:rotate(360deg)}}
del{background:#fde8e6;color:#8c1d18;text-decoration:line-through;border-radius:3px;padding:0 2px}
ins{background:#dff3e6;color:#145c38;text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}
.uyapbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:6px 2px 0;font-size:.85rem}
.uyapbar a{padding:3px 8px;font-size:.78rem;white-space:nowrap;border:1px solid var(--line, #0002);border-radius:999px;text-decoration:none;font-weight:600}
.uyapbar span{font-size:.78rem}
mark.h0{background:#ffe58a;color:#1a1a1a}mark.h1{background:#a8e6b8;color:#1a1a1a}mark.h2{background:#a9d4ff;color:#1a1a1a}mark.h3{background:#ffc2d1;color:#1a1a1a}mark.h4{background:#d9c2ff;color:#1a1a1a}mark.h5{background:#ffd1a6;color:#1a1a1a}
.hlleg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.hlleg button{border:0;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;color:#1a1a1a}
mark.cur{outline:2px solid var(--navy, #123);outline-offset:1px}
.diff{white-space:normal}
.hist{padding-left:20px;margin:6px 0}.hist li{margin:6px 0}
.sugg button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-top:0;padding:10px 12px;cursor:pointer;font-size:.95rem}
.sugg button:first-child{border-top:1px solid var(--line);border-radius:10px 10px 0 0;margin-top:4px}.sugg button:last-child{border-radius:0 0 10px 10px}
.sugg button:only-child{border-radius:10px}
details summary{cursor:pointer;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}
.steps button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:.88rem;cursor:pointer;color:var(--text)}
.steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);margin-right:4px;font-size:.78rem}
.steps button.on{border-color:var(--navy);background:var(--navy);color:#fff}.steps button.on b{background:var(--gold);color:var(--navy)}
.steps button.off{opacity:.45;cursor:default}
.pick{display:flex;align-items:stretch;gap:0;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.pick.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pick .chk{display:grid;place-items:center;padding:0 12px;margin:0;border-right:1px solid var(--line);cursor:pointer}
.pick .chk input{width:22px;height:22px;min-height:0;accent-color:var(--navy)}
.pick .pbody{flex:1;text-align:left;background:none;border:0;padding:12px;cursor:pointer;color:var(--text)}
.pick .pbody b{display:block;font-weight:600}.pick .pbody span{color:var(--muted);font-size:.88rem}
.peek{margin-top:6px;max-height:45vh;font-size:.95rem}
.pickbar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;box-shadow:0 -4px 14px #0000000f}
.tbl .trow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 2px}
.tbl .trow span{display:block}
.tbl .trow > div:last-child{white-space:nowrap;text-align:right}
.tag2{flex:none;font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--line)}
.o-onama,.o-kabul,.o-ihlal{background:#dff3e6;color:#145c38}.o-bozma,.o-ret,.o-kaldirma,.o-ihlal_yok{background:#fde8e6;color:#8c1d18}
@media (prefers-color-scheme:dark){ .o-onama,.o-kabul,.o-ihlal{background:#173a28;color:#9be0b4} .o-bozma,.o-ret,.o-kaldirma,.o-ihlal_yok{background:#4a1f1c;color:#ffb4ab} }
.evc{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--card)}
.evc .evd{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.evc .evd b{display:block;font-family:var(--serif);font-size:1.15rem}.evc .evd span{font-size:.82rem;color:var(--muted)}
.evc .evb{flex:1;min-width:0}.evc .evb b{display:block}.evc .evb span{display:block;color:var(--muted);font-size:.88rem}
.evc.soon{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.evc.late{border-color:var(--err)}.evc.done{opacity:.55}
.evact{margin-top:6px;font-size:.84rem;line-height:1.9}
.hist-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.hist-row button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .clr{border:0;background:none;color:var(--err);text-decoration:underline;padding:6px 4px}
@media (prefers-color-scheme:dark){ del{background:#4a1f1c;color:#ffb4ab} ins{background:#173a28;color:#9be0b4} }
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}
.wstrip button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:center}
.wstrip button span{font-size:.75rem;color:var(--muted)}.wstrip button b{font-family:var(--serif);font-size:1.1rem}.wstrip button i{font-style:normal;font-size:.6rem;color:var(--gold);letter-spacing:1px}
.wstrip button.on{border-color:var(--gold);background:var(--gold-soft)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.calgrid .calh{font-size:.75rem;color:var(--muted);text-align:center}
.calgrid button{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;color:var(--text);font-size:.92rem}
.calgrid button.out{opacity:.4}.calgrid button.today{border-color:var(--gold);font-weight:700}.calgrid button.sel{background:var(--gold-soft);border-color:var(--gold)}.calgrid button.hol{color:var(--err)}
.calgrid button i{position:absolute;right:3px;top:2px;font-style:normal;font-size:.62rem;background:var(--gold);color:#fff;border-radius:999px;padding:0 5px}
.calday{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--card)}.calday.today{border-color:var(--gold)}
.calday b{display:block;margin-bottom:4px}.calit{display:block;font-size:.9rem;padding:3px 0;color:var(--text);text-decoration:none}.calit.done{opacity:.5;text-decoration:line-through}
details.fsec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--card)}details.fsec summary{cursor:pointer}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.kstats div{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.kstats b{display:block;font-family:var(--serif);font-size:1.05rem}.kstats span{font-size:.78rem;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:118px;border-bottom:1px solid var(--line);padding-top:6px}
.flow div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.flow .fin,.flow .fout{display:inline-block;width:42%;border-radius:3px 3px 0 0;min-height:1px}.flow .fin{background:var(--ok)}.flow .fout{background:var(--err)}
.flow div{flex-direction:row;align-items:flex-end;gap:2px}.flow i{position:absolute;bottom:-18px;font-style:normal;font-size:.62rem;color:var(--muted)}
.lockscr{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockscr .card{max-width:340px;width:100%;text-align:center}
@media (max-width:520px){ .tabs button{padding:8px 12px;font-size:.93rem} .top nav a:not(.primary){display:none} .stats{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><span class="brand-mark">⚖</span><span id="brandName">Hukuk Platformu</span></a>
    <nav id="topnav"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="site">
  <div class="wrap">
    <nav>
      <a href="#/kullanim">Nasıl kullanılır?</a>
      <a href="#/paketler">Paketler</a>
      <a href="#/kosullar">Kullanım Koşulları</a>

      <a href="#/sorumluluk">Sorumluluk Reddi</a>
      <a id="supportLink" href="#">İletişim</a>
    </nav>
    <div>© <span id="year"></span> <span class="ownerName"></span>. Tüm hakları saklıdır.</div>
    <div class="small">Bu platform avukatlık veya hukuki danışmanlık hizmeti sunmaz; bir araştırma ve metin analiz aracıdır.</div>
  </div>
</footer>
