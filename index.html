<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hukuk Platformu</title>
<meta name="description" content="Resmî kaynaklara dayalı hukuk araştırma ve metin analiz platformu: Yargıtay, UYAP Emsal ve Danıştay kararlarında arama, yapay zekâ ile karar özeti, sözleşme analizi ve dilekçe taslağı.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy-2:#1f3160; --gold:#c9a24b; --gold-soft:#f4ead3;
  --bg:#f7f6f2; --card:#ffffff; --text:#1d2433; --muted:#5d6678; --line:#e3e1da;
  --ok:#1f7a4d; --err:#b3261e; --radius:14px;
  --serif:"Source Serif 4", Georgia, serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1524; --card:#18213a; --text:#e8eaf0; --muted:#a3abbd; --line:#2a3555; --gold-soft:#2e2a1f; --navy-2:#273b73; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hidden{display:none!important}

/* üst bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.1rem}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:1.05rem}
.top nav{display:flex;gap:6px}
.top nav a{text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.92rem}
.top nav a.primary{background:var(--gold);color:var(--navy);font-weight:600}

/* düğmeler ve form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;text-decoration:none;min-height:46px}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.locked{opacity:.45;pointer-events:none}
.btn-block{width:100%}
label{display:block;font-size:.9rem;font-weight:500;margin:14px 0 6px}
input[type=email],input[type=password],input[type=text],input[type=url],input[type=date],input[type=number],input[type=time],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:46px}
textarea{min-height:180px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.9rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.narrow{max-width:440px;margin:28px auto}
.msg{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.93rem}
.msg.err{background:#fde8e6;color:var(--err)}
.msg.ok{background:#e2f3ea;color:var(--ok)}
@media (prefers-color-scheme: dark){ .msg.err{background:#3b1f20;color:#ffb4ab} .msg.ok{background:#173326;color:#9fe0bd} }

/* açılış */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:56px 0 64px}
.eyebrow{display:inline-block;font-size:.75rem;letter-spacing:.12em;font-weight:600;color:var(--gold);margin-bottom:14px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);max-width:720px}
.hero p{max-width:640px;color:#d7dcea;font-size:1.05rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .btn-ghost{color:#fff;border-color:#ffffff55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;max-width:620px}
.stats div{background:#ffffff12;border-radius:12px;padding:12px}
.stats b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--gold)}
.stats span{font-size:.8rem;color:#c8cfe0}
section.block{padding:44px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.feature .ico{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;font-size:1.2rem;margin-bottom:10px}
.feature p{margin:0;color:var(--muted);font-size:.95rem}
.trust{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plans .plan{position:relative}
.plan .price{font-family:var(--serif);font-size:2rem;font-weight:700}
.plan .price small{font-size:.9rem;font-weight:400;color:var(--muted)}
.plan ul{padding-left:18px;margin:12px 0 18px;color:var(--muted)}
.plan.featured{border:2px solid var(--gold)}
.plan .tag{position:absolute;top:-11px;right:16px;background:var(--gold);color:var(--navy);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px}
footer.site{padding:28px 0 calc(28px + env(safe-area-inset-bottom));color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
footer.site nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}

/* panel */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem}
.chips button.on{background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.searchrow{display:flex;gap:8px;margin-top:10px}
.searchrow input{flex:1}
.result{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer}
.result b{display:block;font-weight:600}
.result span{color:var(--muted);font-size:.9rem}
.doc{white-space:pre-wrap;font-family:var(--serif);font-size:1.02rem;line-height:1.7;max-height:60vh;overflow:auto;padding:16px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.out{white-space:pre-wrap;line-height:1.65}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:var(--gold)}
.notice{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:.9rem;margin:14px 0}
.legal h2{margin-top:1.4em;font-size:1.2rem}
.legal h3{margin:1.1em 0 .3em;font-size:1.05rem}
.legal p,.legal li{color:var(--text)}
.spinner{width:18px;height:18px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.btn-ghost .spinner,.btn-gold .spinner{border-color:#0002;border-top-color:currentColor}
@keyframes sp{to{transform:rotate(360deg)}}
del{background:#fde8e6;color:#8c1d18;text-decoration:line-through;border-radius:3px;padding:0 2px}
ins{background:#dff3e6;color:#145c38;text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}
.diff{white-space:normal}
.hist{padding-left:20px;margin:6px 0}.hist li{margin:6px 0}
.sugg button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-top:0;padding:10px 12px;cursor:pointer;font-size:.95rem}
.sugg button:first-child{border-top:1px solid var(--line);border-radius:10px 10px 0 0;margin-top:4px}.sugg button:last-child{border-radius:0 0 10px 10px}
.sugg button:only-child{border-radius:10px}
details summary{cursor:pointer;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}
.steps button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:.88rem;cursor:pointer;color:var(--text)}
.steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);margin-right:4px;font-size:.78rem}
.steps button.on{border-color:var(--navy);background:var(--navy);color:#fff}.steps button.on b{background:var(--gold);color:var(--navy)}
.steps button.off{opacity:.45;cursor:default}
.pick{display:flex;align-items:stretch;gap:0;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.pick.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pick .chk{display:grid;place-items:center;padding:0 12px;margin:0;border-right:1px solid var(--line);cursor:pointer}
.pick .chk input{width:22px;height:22px;min-height:0;accent-color:var(--navy)}
.pick .pbody{flex:1;text-align:left;background:none;border:0;padding:12px;cursor:pointer;color:var(--text)}
.pick .pbody b{display:block;font-weight:600}.pick .pbody span{color:var(--muted);font-size:.88rem}
.peek{margin-top:6px;max-height:45vh;font-size:.95rem}
.pickbar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;box-shadow:0 -4px 14px #0000000f}
.tbl .trow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 2px}
.tbl .trow span{display:block}
.tbl .trow > div:last-child{white-space:nowrap;text-align:right}
.tag2{flex:none;font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--line)}
.o-onama,.o-kabul,.o-ihlal{background:#dff3e6;color:#145c38}.o-bozma,.o-ret,.o-kaldirma,.o-ihlal_yok{background:#fde8e6;color:#8c1d18}
@media (prefers-color-scheme:dark){ .o-onama,.o-kabul,.o-ihlal{background:#173a28;color:#9be0b4} .o-bozma,.o-ret,.o-kaldirma,.o-ihlal_yok{background:#4a1f1c;color:#ffb4ab} }
.evc{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--card)}
.evc .evd{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.evc .evd b{display:block;font-family:var(--serif);font-size:1.15rem}.evc .evd span{font-size:.82rem;color:var(--muted)}
.evc .evb{flex:1;min-width:0}.evc .evb b{display:block}.evc .evb span{display:block;color:var(--muted);font-size:.88rem}
.evc.soon{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.evc.late{border-color:var(--err)}.evc.done{opacity:.55}
.evact{margin-top:6px;font-size:.84rem;line-height:1.9}
.hist-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.hist-row button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .clr{border:0;background:none;color:var(--err);text-decoration:underline;padding:6px 4px}
@media (prefers-color-scheme:dark){ del{background:#4a1f1c;color:#ffb4ab} ins{background:#173a28;color:#9be0b4} }
@media (max-width:520px){ .tabs button{padding:8px 12px;font-size:.93rem} .top nav a:not(.primary){display:none} .stats{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><span class="brand-mark">⚖</span><span id="brandName">Hukuk Platformu</span></a>
    <nav id="topnav"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="site">
  <div class="wrap">
    <nav>
      <a href="#/kullanim">Nasıl kullanılır?</a>
      <a href="#/paketler">Paketler</a>
      <a href="#/kosullar">Kullanım Koşulları</a>
      <a href="#/kvkk">KVKK Aydınlatma Metni</a>
      <a href="#/sorumluluk">Sorumluluk Reddi</a>
      <a id="supportLink" href="#">İletişim</a>
    </nav>
    <div>© <span id="year"></span> <span class="ownerName"></span>. Tüm hakları saklıdır.</div>
    <div class="small">Bu platform avukatlık veya hukuki danışmanlık hizmeti sunmaz; bir araştırma ve metin analiz aracıdır.</div>
  </div>
</footer>

<script>
"use strict";
// ================== AYARLAR ==================
const CONFIG = {
  APP_NAME: "Hukuk Platformu",            // yayın adı netleşince değiştirin
  OWNER: "Yurdagül Güler",                // hak sahibi / hizmet sağlayıcı / veri sorumlusu
  SUPPORT_EMAIL: "yolhava.destek@gmail.com",
  API_URL: "https://hukuk-api.yolhava-destek.workers.dev",   // Cloudflare Worker adresi
  TERMS_DATE: "14.10.2026",
  FEATURES: { mevzuat: true },
};
// ============================================

const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const state = { token: store.get("hp_token"), user: null, source: "arsiv", archCfg: "yargitay", lastSearch: null, tab: "ara" };

function apiBase(){ return (CONFIG.API_URL || store.get("hp_api") || "").replace(/\/+$/, ""); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ts){ return ts ? new Date(ts * 1000).toLocaleString("tr-TR", {dateStyle:"medium", timeStyle:"short"}) : ""; }

async function api(path, body){
  const base = apiBase();
  if (!base) throw new Error("Sunucu adresi ayarlanmamış. Hesap > Sunucu ayarı bölümünden girin.");
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let res;
  try {
    res = await fetch(base + path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error("Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin."); }
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && state.token && !["/api/login","/api/account/delete"].includes(path)) { logoutLocal(); }
  if (!res.ok) { const er = new Error(data.error || `İşlem başarısız (HTTP ${res.status}).`); er.data = data; throw er; }
  return data;
}

function busy(btn, on, label){
  if (!btn) return;
  if (on){ btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>${label || "Bekleyin…"}`; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}
function showMsg(el, text, ok){ el.className = "msg " + (ok ? "ok" : "err"); el.textContent = text; el.classList.remove("hidden"); }

function logoutLocal(){ state.token = null; state.user = null; store.set("hp_token", null); renderNav(); }

function renderNav(){
  const nav = $("#topnav");
  nav.innerHTML = state.token
    ? `<a href="#/kullanim">Kullanım</a><a href="#/panel" class="primary">Panelim</a>`
    : `<a href="#/kullanim">Kullanım</a><a href="#/giris">Giriş</a><a href="#/kayit" class="primary">Ücretsiz dene</a>`;
}

// ================== SAYFALAR ==================
function pageHome(){
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <span class="eyebrow">KAYNAK DOĞRULAMALI HUKUK ARAŞTIRMASI</span>
    <h1>İçtihat araştırmanızı dakikalardan saniyelere indirin.</h1>
    <p>Yargıtay, UYAP Emsal ve Danıştay kararlarında doğrudan resmî kaynaktan arama yapın. Bulduğunuz kararı yapay zekâyla özetleyin, sözleşmeleri risk açısından inceleyin, dilekçe taslağının iskeletini çıkarın.</p>
    <div class="cta"><a class="btn btn-gold" href="#/kayit">7 gün ücretsiz deneyin</a><a class="btn btn-ghost" href="#/paketler">Paketleri görün</a></div>
    <div class="stats">
      <div><b>11M+</b><span>karar hedefi</span></div>
      <div><b>3</b><span>resmî karar bankası</span></div>
      <div><b>0</b><span>uydurma künye</span></div>
    </div>
  </div></section>

  <section class="block"><div class="wrap">
    <h2>Neler yapabilirsiniz?</h2>
    <div class="grid">
      ${feature("🔎","Resmî kaynakta karar arama","Yargıtay, UYAP Emsal ve Danıştay karar bankalarında tek ekrandan arama. Künye her zaman resmî kaynaktan gelir.")}
      ${feature("📝","Karar özeti","Uzun kararların uyuşmazlık, gerekçe ve hüküm kısımlarını tek tıkla çıkarın.")}
      ${feature("📑","Sözleşme risk analizi","Tek taraflı ve riskli maddeleri, eksik hükümleri ve müzakere önerilerini görün.")}
      ${feature("✍️","Dilekçe Asistanı","Dava türünü ve olayı yazın; mevzuat ve kararlar taransın, konuyla ilgili olanlar ayrılsın, analiz edilsin ve avukat dilekçesi düzeninde taslak hazırlansın.")}
      ${feature("🌐","Hukuki çeviri","Hukuki metinleri terim tutarlılığını koruyarak çevirin.")}
      ${feature("⚖️","Karar karşılaştırma","Benzer kararlar arasındaki farkı ve sonucu değiştiren olguyu görün.")}
    </div>
  </div></section>

  <section class="block trust"><div class="wrap">
    <h2>Güvenle çalışın</h2>
    <div class="grid">
      ${feature("✅","Uydurma içtihat yok","Yapay zekâ yalnızca sizin verdiğiniz veya resmî kaynaktan gelen metinle çalışır; hafızasından karar numarası üretmez.")}
      ${feature("🔒","Metinleriniz saklanmaz","Analiz için gönderdiğiniz metinler işlenir ve kaydedilmez. Şifreniz geri çözülemez biçimde saklanır.")}
      ${feature("📜","KVKK'ya uygun yapı","Hesabınızı ve verilerinizi dilediğiniz an tek tuşla silebilirsiniz.")}
    </div>
  </div></section>

  <section class="block"><div class="wrap" style="text-align:center">
    <h2>Büronuzun araştırma yükünü hafifletin</h2>
    <p class="muted">Kayıt olun, Optimus paketinin tüm özelliklerini 7 gün boyunca ücretsiz kullanın.</p>
    <a class="btn btn-primary" href="#/kayit">Hemen başlayın</a>
  </div></section>`;
}
function feature(ico, title, text){ return `<article class="card feature"><div class="ico">${ico}</div><h3>${esc(title)}</h3><p>${esc(text)}</p></article>`; }

const PLAN_INFO = [
  { key:"basic", name:"Basic", price:"0 ₺", items:["Günde 10 karar araması","Günde 3 karar özeti","Metin yapıştırarak kullanım"] },
  { key:"optimus", name:"Optimus", price:"700 ₺", year:"7.000 ₺", featured:true, items:["Günde 200 karar araması","Günde 50 yapay zekâ işlemi","Dilekçe Asistanı (5 emsal kararla)","Sözleşme analizi ve düzeltilmiş yeni versiyon, hukuki çeviri","UYAP (UDF/EYP), PDF, Word ve fotoğraf yükleme","40.000 karaktere kadar belge"] },
  { key:"maximus", name:"Maximus", price:"1.200 ₺", year:"12.000 ₺", items:["Günde 1.000 karar araması","Günde 200 yapay zekâ işlemi","Dilekçe Asistanı (10 emsal kararla)","Optimus'un tüm özellikleri + karar karşılaştırma","80.000 karaktere kadar belge","Öncelikli destek"] },
];
function pagePlans(){
  app.innerHTML = `<section class="block plans"><div class="wrap">

const SOURCE_LABELS = { arsiv: "📚 11M Arşiv", yargitay: "Yargıtay", emsal: "UYAP Emsal", danistay: "Danıştay" };
const ARCH_LABELS = { yargitay: "Yargıtay", emsal: "UYAP Emsal", danistay: "Danıştay", aym_bb: "AYM Bireysel Başvuru", aym_norm: "AYM Norm Denetimi" };
function tabSearch(){
  const b = $("#tabbody");
  b.innerHTML = `<div class="card">
    <h2>Karar ara</h2>
    <div class="chips" id="src">${Object.entries(SOURCE_LABELS).map(([k,v]) => `<button data-s="${k}" class="${k===state.source?"on":""}">${v}</button>`).join("")}</div>

    <form id="sf" class="searchrow"><input id="q" type="text" placeholder="ör. fazla mesai ispat yükü" maxlength="300" required value="${esc(state.lastSearch?.q || "")}"><button class="btn btn-primary">Ara</button></form>
    <p class="muted small" style="margin:8px 0 0">📚 11M Arşiv: 11 milyon Yargıtay, UYAP Emsal, Danıştay ve AYM kararında arama; esas veya karar no ile de arayabilirsiniz (ör. 2021/1234). Birden fazla ifade için "+", virgül veya tire kullanın: <i>kıdem tazminatı + fazla mesai</i>.</p>

  $("#cfg").onchange = e => { state.archCfg = e.target.value; };
  $("#sf").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { addHist(q, state.source, state.archCfg || "yargitay"); drawHist(); } doSearch(q, 1, $("#sf button")); };

// Arama: "11M Arşiv" seçiliyse UYAP Emsal sonuçları hemen gösterilir, arşiv sonuçları gelince altına eklenir.
function drawHist(){
  const box = $("#hist"); if (!box) return;
  const h = getHist();
  if (!h.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="hist-row"><span class="muted small">Son aramalar:</span>${h.slice(0, 8).map((x, i) => `<button data-h="${i}" title="${esc(x.q)}">${esc(x.q.length > 32 ? x.q.slice(0, 32) + "…" : x.q)}</button>`).join("")}<button class="clr" id="hclr">Geçmişi temizle</button></div>`;
  box.onclick = e => {
    if (e.target.id === "hclr") { if (confirm("Arama geçmişi silinsin mi?")) { clearHist(); drawHist(); } return; }
    const b = e.target.closest("[data-h]"); if (!b) return;
    const x = getHist()[+b.dataset.h]; if (!x) return;
    state.source = x.s; state.archCfg = x.c;
    document.querySelectorAll("#src button").forEach(y => y.classList.toggle("on", y.dataset.s === x.s));
    $("#archBox").classList.toggle("hidden", x.s !== "arsiv"); if ($("#cfg")) $("#cfg").value = x.c;
    $("#q").value = x.q; addHist(x.q, x.s, x.c); drawHist(); doSearch(x.q, 1, $("#sf button"));
  };
}
async function doSearch(q, page, btn){
  busy(btn, true, "Aranıyor…"); $("#m").classList.add("hidden");
  const cfg = state.archCfg || "yargitay";
  if (state.source !== "arsiv") {
    try { const r = await api("/api/search", { source: state.source, q, page }); mergeSection("main", r, page); }
    catch (err) { showMsg($("#m"), err.message); }
    finally { busy(btn, false); }
    return;
  }
  if (page === 1) { state.lastSearch = { q, sections: {} }; state.fastOpen = false; }
  const fast = cfg === "danistay" ? "danistay" : "emsal";   // hızlı resmî kaynak
  const pFast = api("/api/search", { source: fast, q, page: 1 }).then(r => mergeSection("fast", r, 1)).catch(e => mergeSection("fast", { error: e.message, sourceLabel: SOURCE_LABELS[fast] }, 1));
  state.lastSearch.sections.arch = { pending: true, sourceLabel: "📚 11M Arşiv · " + ARCH_LABELS[cfg] };
  drawAll(true);
  pFast.finally(() => busy(btn, false));
  try { const r = await api("/api/search", { source: "arsiv", q, page: 1, config: cfg, paired: true }); mergeSection("arch", r, 1); }
  catch (err) { mergeSection("arch", { error: err.message, sourceLabel: "📚 11M Arşiv · " + ARCH_LABELS[cfg] }, 1); }
}
function mergeSection(key, r, page){
  if (!state.lastSearch || (key === "main" && page === 1)) state.lastSearch = { q: $("#q") ? $("#q").value : "", sections: {} };
  const old = state.lastSearch.sections[key];
  if (page > 1 && old && old.items && r.items) r.items = old.items.concat(r.items);
  state.lastSearch.sections[key] = r;
  drawAll(page === 1 && key !== "arch");
}
async function moreSection(key, btn){
  const sec = state.lastSearch.sections[key]; busy(btn, true, "Yükleniyor…");
  try {
    const body = { source: sec.source, q: state.lastSearch.q, page: sec.page + 1 };
    if (sec.source === "arsiv") { body.config = sec.config; body.paired = key === "arch"; }
    mergeSection(key, await api("/api/search", body), sec.page + 1);
  } catch (err) { showMsg($("#m"), err.message); }
  finally { busy(btn, false); }
}
function drawAll(scroll){
  const box = $("#results"); if (!box || !state.lastSearch) return;
  const order = ["main", "fast", "arch"].filter(k => state.lastSearch.sections[k]);
  box.innerHTML = order.map(k => {
    const r = state.lastSearch.sections[k];
    const head = `<h3 style="margin:18px 2px 0;font-size:1rem">${esc(r.sourceLabel || "")}</h3>`;
    if (r.pending) return head + `<div class="card" style="margin-top:8px"><span class="muted"><span class="spinner" style="display:inline-block;vertical-align:middle;border-color:#0002;border-top-color:var(--gold)"></span> 11 milyon karar içinde aranıyor… (ilk aramada 10-20 saniye sürebilir, siz yukarıdaki sonuçlara bakabilirsiniz)</span></div>`;
    if (r.error) return head + `<div class="msg err">${esc(r.error)}</div>`;
    if (!r.items.length) return head + `<p class="muted" style="margin:6px 2px">Sonuç bulunamadı.</p>`;
    return head + (r.note ? `<div class="notice">${esc(r.note)}</div>` : "") +
      `<p class="muted small" style="margin:4px 2px 0">yaklaşık ${Number(r.total).toLocaleString("tr-TR")} sonuç${r.quota ? ` · bugünkü arama: ${r.quota.used}/${r.quota.limit}` : ""}</p>` +
      (k === "fast" && !state.fastOpen ? r.items.slice(0, 5) : r.items).map((it, i) => `<button class="result" data-k="${k}" data-i="${i}"><b>${esc(it.daire)}</b><span>E. ${esc(it.esas || "—")} · K. ${esc(it.karar || "—")} · ${esc(it.tarih || "")}</span></button>`).join("") +
      (k === "fast" && !state.fastOpen && r.items.length > 5 ? `<div class="row"><button class="btn btn-ghost btn-block" data-open="1">${esc(r.sourceLabel)}: diğer sonuçları göster</button></div>`
        : (r.items.length < r.total || r.more) ? `<div class="row"><button class="btn btn-ghost btn-block" data-more="${k}">Daha fazla sonuç</button></div>` : "");
  }).join("");
  box.onclick = e => {
    if (e.target.closest("[data-open]")) { state.fastOpen = true; return drawAll(false); }
    const m = e.target.closest("[data-more]"); if (m) return moreSection(m.dataset.more, m);
    const el = e.target.closest(".result"); if (!el) return;
    const r = state.lastSearch.sections[el.dataset.k]; openDecision(r.source, r.items[+el.dataset.i]);
  };
  if (scroll) box.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function openDecision(source, item){

    </div>`;
    const qNow = (state.lastSearch && state.lastSearch.q) || "";
    $("#doc").innerHTML = highlightPhrases(d.text, hlTerms(qNow));
    $("#toFolder").onclick = () => saveToFolder({ tur: "karar", baslik: kunye, metin: String(d.text || "").slice(-700).trim(), ref: { source, item } }, $("#m"));
    const addBtn = $("#toDlRef");

      if (dlPickedList().length >= dlMax()) return showMsg($("#m"), `Dilekçe Asistanı'nda en fazla ${dlMax()} karar seçilebilir.`);
      dl.picked[k] = { source, label: SOURCE_LABELS[source] || "", q: qNow, item }; dl.facts = null;
      addBtn.textContent = "Dilekçeye eklendi ✓";
    };
    $("#back").onclick = () => renderTab();

    $("#sum").onclick = async () => {
      const btn = $("#sum"); busy(btn, true, "Özetleniyor…");
      try { await streamAI({ task: "ozet", text: d.text }, $("#sumOut")); }
      catch (err) { showMsg($("#m"), err.message); }

    };
  } catch (err) {

    b.innerHTML = `<div class="card"><div class="msg err">${esc(err.message)}</div>
      ${off ? `<p class="small muted">Kararın metni platforma aktarılamadı, ancak resmî sitede açılabilir:</p><a class="btn btn-gold" href="${esc(off)}" target="_blank" rel="noopener">Resmî sitede aç</a>` : ""}

    $("#back").onclick = () => renderTab();
  }
}
// Canlı yapay zekâ yanıtı: metin üretildikçe ekrana akar.
const fmtAI = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
async function streamAI(body, el){
  el.classList.remove("hidden");
  el.innerHTML = `<span class="muted">Yapay zekâ yazıyor…</span>`;
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let res;
  try { res = await fetch(apiBase() + "/api/ai-stream", { method: "POST", headers, body: JSON.stringify(body) }); }
  catch { el.classList.add("hidden"); throw new Error("Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin."); }
  if (!res.ok) {
    let d = {}; try { d = await res.json(); } catch {}
    el.classList.add("hidden");
    if (res.status === 401) logoutLocal();
    throw new Error(d.error || `İşlem başarısız (HTTP ${res.status}).`);
  }
  const note = decodeURIComponent(res.headers.get("X-Note") || "");
  const quota = { used: res.headers.get("X-Quota-Used"), limit: res.headers.get("X-Quota-Limit") };
  let text = "";
  if (res.body && res.body.getReader) {
    const rd = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      text += dec.decode(value, { stream: true });
      el.innerHTML = fmtAI(text) + `<span class="muted"> ▍</span>`;
    }
  } else { text = await res.text(); }
  showAI(el, { answer: text.trim(), note, quota });
  return text.trim();
}
function showAI(el, r){
  el.classList.remove("hidden");
  el.innerHTML = fmtAI(r.answer) +
    (r.note ? `<p class="muted small">${esc(r.note)}</p>` : "") +
    `<p class="muted small">Bugünkü yapay zekâ kullanımı: ${r.quota.used}/${r.quota.limit}</p>` +
    `<div class="row"><button class="btn btn-ghost" data-copy>Sonucu kopyala</button></div>`;
  el.querySelector("[data-copy]").onclick = e => copy(r.answer, e.target);
}
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = "Kopyalandı ✓"; setTimeout(() => btn.textContent = o, 1500); }
  catch { alert("Kopyalanamadı; metni basılı tutarak seçebilirsiniz."); }
}

// ---------- dosya okuma (tamamen tarayıcıda; dosya sunucuya gönderilmez) ----------
const LIB = {
  jszip: "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
  pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs",
  pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs",
  ocr: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
};
const loaded = {};
function loadScript(src){
  if (!loaded[src]) loaded[src] = new Promise((ok, fail) => {
    const sc = document.createElement("script"); sc.src = src; sc.onload = ok;
    sc.onerror = () => { delete loaded[src]; fail(new Error("Dosya okuyucu yüklenemedi; internet bağlantınızı kontrol edin.")); };
    document.head.appendChild(sc);
  });
  return loaded[src];
}
const xmlText = xml => new DOMParser().parseFromString(xml, "application/xml");
async function readZip(buf){ await loadScript(LIB.jszip); return window.JSZip.loadAsync(buf); }
async function udfText(zip){
  const f = zip.file("content.xml"); if (!f) throw new Error("UDF içeriği bulunamadı.");
  const doc = xmlText(await f.async("string"));
  const c = doc.getElementsByTagName("content")[0];
  return (c ? c.textContent : doc.documentElement.textContent || "").replace(/￼/g, "").trim();
}
async function docxText(zip){
  const doc = xmlText(await zip.file("word/document.xml").async("string"));
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  return [...doc.getElementsByTagNameNS(W, "p")].map(p =>
    [...p.getElementsByTagNameNS(W, "t")].map(t => t.textContent).join("")).join("\n").trim();
}
async function pdfText(buf){
  const lib = await import(LIB.pdf);
  lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 200); i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    pages.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
  }
  const text = pages.join("\n\n").replace(/[ \t]+/g, " ").trim();
  if (text.length < 40) throw new Error("Bu PDF taranmış (resim) bir belge gibi görünüyor; içinden metin okunamadı. Sayfaların fotoğrafını '📷 Fotoğraf çek' veya '🖼️ Galeriden seç' ile yükleyin.");
  return text;
}
async function fileText(name, buf, depth = 0){
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "txt") return new TextDecoder("utf-8").decode(buf);
  if (ext === "pdf") return pdfText(buf);
  if (ext === "doc") throw new Error("Eski Word (.doc) biçimi desteklenmiyor; belgeyi .docx veya PDF olarak kaydedip yükleyin.");
  if (["udf", "docx", "eyp", "zip"].includes(ext)) {
    const zip = await readZip(buf);
    if (zip.file("content.xml")) return udfText(zip);
    if (zip.file("word/document.xml")) return docxText(zip);
    if (depth > 2) return "";
    // EYP (imzalı UYAP paketi) veya zip: içindeki belgeleri sırayla oku
    const parts = [];
    for (const f of Object.values(zip.files)) {
      if (f.dir || !/\.(udf|pdf|docx|txt|eyp)$/i.test(f.name)) continue;
      try { const t = await fileText(f.name, await f.async("arraybuffer"), depth + 1); if (t.trim()) parts.push(`--- ${f.name.split("/").pop()} ---\n${t.trim()}`); } catch {}
    }
    if (!parts.length) throw new Error("Paketin içinde okunabilir belge bulunamadı.");
    return parts.join("\n\n");
  }
  throw new Error("Bu dosya türü desteklenmiyor. UDF, EYP, PDF, Word (.docx) veya .txt yükleyin.");
}
async function shrinkImage(file){
  // Büyük fotoğrafları küçült: yazı tanıma hızlanır, bellek taşmaz.
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 2200 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.25)"; g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function ocrImages(files, onProgress){
  await loadScript(LIB.ocr);
  const worker = await window.Tesseract.createWorker("tur", 1, {
    logger: m => { if (m.status && onProgress) onProgress(m); },
  });
  try {
    const out = [];
    for (let i = 0; i < files.length; i++) {
      onProgress && onProgress({ status: `Sayfa ${i + 1}/${files.length} okunuyor`, progress: 0 });
      const { data } = await worker.recognize(await shrinkImage(files[i]));
      out.push((files.length > 1 ? `--- Sayfa ${i + 1} ---\n` : "") + (data.text || "").trim());
    }
    return out.join("\n\n");
  } finally { await worker.terminate(); }
}

// Sözleşme risk analizinden sonra: önerileri uygulayan yeni versiyon + değişikliklerin kırmızı/yeşil gösterimi
function offerRevision(original, analysis){
  const box = $("#rev");
  const can = allowed(TASK_MIN.sozlesme_revize);
  box.classList.remove("hidden");
  box.innerHTML = `<div class="notice" style="margin-top:14px"><b>Önerileri sözleşmeye uygulayalım mı?</b> Yapay zekâ, analizdeki önerilere göre sözleşmenin düzeltilmiş tam metnini yazar; değişiklikler kırmızı/yeşil gösterilir. Tutar, tarih gibi değerler [ ] olarak bırakılır.</div>
    <button class="btn btn-gold btn-block" id="revGo" ${can ? "" : "disabled"}>✍️ Önerileri uygula — yeni versiyon oluştur</button>
    <div id="revM" class="hidden"></div><div id="revOut" class="hidden card out" style="margin-top:14px"></div><div id="revDiff"></div>`;
  $("#revGo").onclick = async () => {
    const btn = $("#revGo"); busy(btn, true, "Yeni versiyon yazılıyor…"); $("#revM").classList.add("hidden"); $("#revDiff").innerHTML = "";
    try {
      const out = await streamAI({ task: "sozlesme_revize", text: `SÖZLEŞME:\n${original}\n\nRİSK ANALİZİ:\n${analysis}` }, $("#revOut"));
      const parts = out.split(/-{2,}\s*YAPILAN DEĞİŞİKLİKLER\s*-{2,}/i);
      const revised = parts[0].trim();
      const g = wordDiff(original, revised);
      const ch = diffSummary(g).length;
      $("#revDiff").innerHTML = `<div class="card" style="margin-top:14px"><h3>Değişiklikler (eski → yeni)</h3>
        <p class="small">${ch} değişiklik · <del>çıkarılan</del> · <ins>eklenen</ins></p><div class="doc diff">${diffHtml(g)}</div>
        <div class="row"><button class="btn btn-ghost" id="revCopy">Yeni sözleşmeyi kopyala</button><button class="btn btn-ghost" id="revDocx">Word (.docx) indir</button></div></div>`;
      $("#revCopy").onclick = e => copy(revised, e.target);
      $("#revDocx").onclick = () => downloadDocx(revised, "sozlesme-yeni-versiyon.docx").catch(err => showMsg($("#revM"), err.message));
    } catch (err) { showMsg($("#revM"), err.message); }
    finally { busy(btn, false); }
  };
}

7179|Askeralma Kanunu`.split("\n").map(l => { const [no, name] = l.split("|"); return { no, name, tur: "1" }; });
const TYPES = [["1", "Kanun"], ["4", "Kanun Hükmünde Kararname"], ["19", "Cumhurbaşkanlığı Kararnamesi"]];
const TOP_LAWS = ["6098", "4721", "5237", "5271", "6100", "2004", "4857", "6102"];
const lawCache = {};                       // aynı oturumda tekrar indirilmez, arama hakkı tekrar düşmez
const trLower = s => String(s).replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase();

// Madde başı: "MADDE 7-", "Madde 7 –", "Ek Madde 2 -", "GEÇİCİ MADDE 1-", "Mükerrer Madde 21 -"
const ART_RE = /^\s*(?:(Ek|EK|Geçici|GEÇİCİ|Mükerrer|MÜKERRER)\s+)?(?:Madde|MADDE)\s+(\d+(?:\s*\/\s*[A-Za-zÇĞİÖŞÜçğıöşü])?)\s*[-\u2013\u2014]/;
// Değişiklik notları: "(Değişik: 24/11/2016-6763/24 md.)", "(Ek fıkra: ...)", "(Mülga: ...)", "(İptal: Anayasa Mahkemesinin ...)"
const NOTE_RE = /\(\s*(Değişik|Ek|Mülga|İptal|Yeniden düzenleme|Değiştirilen)([^:()]{0,60}?)\s*:\s*([^()]{3,300}?)\)/g;
// Dipnot biçimi: "7/2/2024 tarihli ve 7499 sayılı Kanunun 5 inci maddesiyle değiştirilmiştir"
const FOOT_RE = /(\d{1,2}\/\d{1,2}\/\d{4})\s+tarihli\s+ve\s+(\d{2,5})\s+sayılı\s+Kanunun\s+(\d+)\s*['’]?\s*\S*\s+maddesiyle\s+(değiştiril|eklen|yürürlükten kaldırıl|mülga)\S*/g;
const VERB = { "değişik": "değiştirildi", "değiştirilen": "değiştirildi", "ek": "eklendi", "mülga": "yürürlükten kaldırıldı",
               "iptal": "Anayasa Mahkemesince iptal edildi", "yeniden düzenleme": "yeniden düzenlendi",
               "değiştiril": "değiştirildi", "eklen": "eklendi", "yürürlükten kaldırıl": "yürürlükten kaldırıldı" };

function htmlToLines(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,head").forEach(n => n.remove());
  // mevzuat.gov.tr metinleri Word çıktısıdır: kaynak koddaki satır sonları cümle ortasında olabilir (ör. "Madde\n699-").
  // Önce metin düğümlerindeki tüm boşluklar teke indirilir, satırlar yalnızca paragraf/satır sonu etiketlerinden oluşturulur.
  if (doc.body) { const w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) n.nodeValue = n.nodeValue.replace(/\s+/g, " "); }
  doc.querySelectorAll("br").forEach(n => n.replaceWith("\n"));
  doc.querySelectorAll("p,div,tr,li,h1,h2,h3,h4,h5,h6,table").forEach(n => n.append("\n"));
  return (doc.body ? doc.body.textContent : "").replace(/\u00a0/g, " ").split("\n")
    .map(l => l.replace(/[ \t]+/g, " ").trim()).filter(Boolean);
}
function parseNotes(text){
  const out = [];
  for (const m of text.matchAll(NOTE_RE)) {
    const type = trLower(m[1]), scope = m[2].trim(), inner = m[3];
    const d = /(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/.exec(inner);
    let law = "", art = "";
    const k = /-\s*((?:KHK\s*-\s*)?\d{2,5})\s*\/\s*(\d+[a-zA-Z]?)\s*md/i.exec(inner);
    if (k) { law = k[1].replace(/\s+/g, ""); art = k[2]; }
    const aym = /E\.?\s*:?\s*(\d{4}\/\d+)\s*[;,]?\s*K\.?\s*:?\s*(\d{4}\/\d+)/i.exec(inner);
    out.push({ type, scope, raw: m[0], date: d ? `${d[1].padStart(2,"0")}.${d[2].padStart(2,"0")}.${d[3]}` : "",
               sort: d ? +(d[3] + d[2].padStart(2,"0") + d[1].padStart(2,"0")) : 0, law, art,
               aym: type === "iptal" && aym ? `E. ${aym[1]}, K. ${aym[2]}` : "" });
  }
  for (const m of text.matchAll(FOOT_RE)) {
    const [dd, mm, yy] = m[1].split("/");
    out.push({ type: trLower(m[4]), scope: "", raw: m[0], date: `${dd.padStart(2,"0")}.${mm.padStart(2,"0")}.${yy}`,
               sort: +(yy + mm.padStart(2,"0") + dd.padStart(2,"0")), law: m[2], art: m[3], aym: "" });
  }
  return out.sort((a, b) => a.sort - b.sort);
}
function parseLaw(html){
  let lines = htmlToLines(html);
  const cut = lines.findIndex(l => /YÜRÜRLÜĞE GİRİŞ TARİHİNİ GÖSTERİR LİSTE|EK VE DEĞİŞİKLİK GETİREN MEVZUAT/i.test(l));
  if (cut > 0) lines = lines.slice(0, cut);
  const title = (lines.slice(0, 40).find(l => /KANUN|ANAYASA/.test(l) && l === l.toLocaleUpperCase("tr-TR") && l.length < 160) || "").trim();
  const arts = [];
  let cur = null;
  lines.forEach((l, i) => {
    const m = ART_RE.exec(l);
    if (m) {
      const kind = m[1] ? trLower(m[1]).replace("geçici", "geçici") : "";
      const num = m[2].replace(/\s+/g, "");
      const prev = lines[i - 1] || "";
      const heading = prev && prev.length < 90 && !ART_RE.test(prev) && !/[.;:]$/.test(prev) && !/KISIM|BÖLÜM|KİTAP|AYIRIM/.test(prev) ? prev : "";
      if (cur && heading && cur.lines[cur.lines.length - 1] === heading) cur.lines.pop();
      cur = { kind, num, key: (kind ? kind + " " : "") + trLower(num), heading, lines: [l] };
      arts.push(cur);
    } else if (cur) cur.lines.push(l);
  });
  arts.forEach(a => {
    a.text = a.lines.join("\n");
    a.label = (a.kind ? a.kind.charAt(0).toLocaleUpperCase("tr-TR") + a.kind.slice(1) + " " : "") + "Madde " + a.num;
    a.notes = parseNotes((a.heading ? a.heading + "\n" : "") + a.text);
    a.last = a.notes.reduce((x, n) => Math.max(x, n.sort), 0);
    delete a.lines;
  });
  return { title, arts, full: lines.join("\n") };
}
function normMadde(s){
  let t = trLower(s).replace(/madde(si)?/g, " ").replace(/\s+/g, " ").trim();
  let kind = "";
  const k = /^(ek|geçici|gecici|mükerrer|mukerrer)\s*/.exec(t);
  if (k) { kind = k[1].replace("gecici", "geçici").replace("mukerrer", "mükerrer"); t = t.slice(k[0].length); }
  t = t.replace(/\s+/g, "");
  return t ? (kind ? kind + " " : "") + t : "";
}
const lawKey = sel => `${sel.tur}/${sel.no}`;
async function fetchLaw(sel){
  const ck = lawKey(sel);
  if (lawCache[ck]) return lawCache[ck];
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let res;
  try { res = await fetch(apiBase() + "/api/mevzuat", { method: "POST", headers, body: JSON.stringify({ no: sel.no, tur: sel.tur, tertip: sel.tertip || 0 }) }); }
  catch { throw new Error("Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin."); }
  if (!res.ok) {
    let d = {}; try { d = await res.json(); } catch {}
    if (res.status === 401) logoutLocal();
    const e = new Error(d.error || `İşlem başarısız (HTTP ${res.status}).`); e.officialUrl = d.officialUrl; throw e;
  }
  const buf = await res.arrayBuffer();
  let cs = (/charset=([\w-]+)/i.exec(res.headers.get("Content-Type") || "") || [])[1] || "utf-8";
  let html = new TextDecoder(cs).decode(buf);
  const meta = /<meta[^>]+charset=["']?([\w-]+)/i.exec(html.slice(0, 3000));
  if (meta && trLower(meta[1]) !== trLower(cs)) { try { html = new TextDecoder(meta[1]).decode(buf); } catch {} }
  const law = parseLaw(html);
  if (!law.arts.length) throw new Error("Metin alındı ama maddeler ayrıştırılamadı. Lütfen bize bildirin; bu sırada metni Mevzuat Bilgi Sistemi'nde açabilirsiniz.");
  law.no = sel.no; law.tur = sel.tur; law.url = res.headers.get("X-Mevzuat-Url") || "";
  const known = sel.tur === "1" && LAWS.find(x => x.no === sel.no);
  const typeName = (TYPES.find(t => t[0] === sel.tur) || [, "Mevzuat"])[1];
  law.name = known ? known.name : law.title ? law.title.charAt(0) + law.title.slice(1).toLocaleLowerCase("tr-TR") : `${sel.no} sayılı ${typeName}`;
  law.quota = { used: res.headers.get("X-Quota-Used"), limit: res.headers.get("X-Quota-Limit") };
  return (lawCache[ck] = law);
}
// Kullanıcı girişini çöz: mevzuat.gov.tr bağlantısı, "Ad (no)", yalnızca numara veya kanun adı
function resolveLaw(q, tur){
  q = String(q || "").trim();
  const u = /MevzuatNo=(\d{1,7})/i.exec(q);
  if (u) return { no: u[1], tur: (/MevzuatTur=(\d{1,2})/i.exec(q) || [, "1"])[1], tertip: +((/MevzuatTertip=(\d)/i.exec(q) || [, 0])[1]) };
  const p = /\((\d{1,7})\)\s*$/.exec(q);
  if (p) return { no: p[1], tur: "1" };
  if (/^\d{1,7}$/.test(q)) return { no: q, tur };
  const hits = searchLaws(q);
  return hits.length ? { no: hits[0].no, tur: "1" } : null;
}
function searchLaws(q){
  const words = trLower(q).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return [];
  return LAWS.map(l => { const n = trLower(l.name); return { l, ok: words.every(w => n.includes(w)), start: n.startsWith(words[0]) }; })
    .filter(x => x.ok).sort((a, b) => (b.start - a.start) || a.l.name.length - b.l.name.length).map(x => x.l);
}
const markNotes = t => esc(t).replace(NOTE_RE, m => `<mark>${m}</mark>`).replace(FOOT_RE, m => `<mark>${m}</mark>`);
function noteLine(n){
  const what = n.scope ? `${n.scope} ` : "";
  const by = n.type === "iptal" ? (n.aym ? ` (${n.aym})` : "")
    : n.law ? ` — ${n.law.startsWith("KHK") ? n.law + " sayılı KHK" : n.law + " sayılı Kanun"}${n.art ? " md. " + n.art : ""}` : "";
  const q = n.law ? encodeURIComponent(`${n.law.replace("KHK", "KHK ")} sayılı ${n.law.startsWith("KHK") ? "kanun hükmünde kararname" : "kanun"} resmi gazete`) : "";
  return `<li><b>${esc(n.date || "tarih belirtilmemiş")}</b> · ${esc(what)}${esc(VERB[n.type] || n.type)}${esc(by)}
    ${q ? ` <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" class="small">Değişiklik kanununu bul ↗</a>` : ""}</li>`;
}

// ---- kelime düzeyinde fark (bilgisayar hesaplar; yapay zekâ kullanılmaz) ----
function lcsDiff(a, b){
  const n = a.length, m = b.length, w = m + 1;
  const L = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i * w + j] = a[i] === b[j] ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push(["=", a[i]]); i++; j++; }
    else if (L[(i + 1) * w + j] >= L[i * w + j + 1]) ops.push(["-", a[i++]]);
    else ops.push(["+", b[j++]]);
  }
  while (i < n) ops.push(["-", a[i++]]);
  while (j < m) ops.push(["+", b[j++]]);
  return ops;
}
const CELL_LIMIT = 4e6;
// Seviyeler: word (kelime) → çok büyükse cümle veya 40 kelimelik parça birimleriyle karşılaştırılır,
// değişen birimler "leaf" seviyesinde kelime kelime incelenir. Her yol sonlanır; telefon kilitlenmez.
function chunkUnits(words){
  const sents = (words.join(" ").match(/[^.;:!?]+[.;:!?]*/g) || []).map(x => x.trim()).filter(Boolean);
  if (sents.length > 1 && sents.length < words.length / 3) return sents;
  const out = []; for (let i = 0; i < words.length; i += 40) out.push(words.slice(i, i + 40).join(" ")); return out;
}
function diffTokens(a, b, level){
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0; while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const A = a.slice(p, a.length - s), B = b.slice(p, b.length - s);
  let mid;
  if (A.length * B.length <= CELL_LIMIT) mid = lcsDiff(A, B);
  else if (level === "word") {
    const so = diffTokens(chunkUnits(A), chunkUnits(B), "unit");
    const split = x => x.split(/\s+/).filter(Boolean);
    mid = []; let del = [], ins = [];
    const flush = () => { if (del.length || ins.length) mid.push(...diffTokens(del.flatMap(split), ins.flatMap(split), "leaf")); del = []; ins = []; };
    so.forEach(([t, v]) => { if (t === "-") del.push(v); else if (t === "+") ins.push(v); else { flush(); split(v).forEach(x => mid.push(["=", x])); } });
    flush();
  } else mid = [...A.map(x => ["-", x]), ...B.map(x => ["+", x])];
  return [...a.slice(0, p).map(x => ["=", x]), ...mid, ...b.slice(b.length - s).map(x => ["=", x])];
}
function wordDiff(oldT, newT){
  const tok = t => t.split(/\s+/).filter(Boolean);
  const ops = diffTokens(tok(oldT), tok(newT), "word");
  const groups = [];
  for (const [t, v] of ops) {
    const g = groups[groups.length - 1];
    if (g && g.t === t) g.v.push(v); else groups.push({ t, v: [v] });
  }
  return groups;
}
function diffHtml(groups){
  return groups.map(g => {
    const s = esc(g.v.join(" "));
    return g.t === "=" ? s : g.t === "-" ? `<del>${s}</del>` : `<ins>${s}</ins>`;
  }).join(" ");
}
function diffSummary(groups){
  const changes = [];
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i];
    if (g.t === "=") continue;
    const nx = groups[i + 1];
    if (g.t === "-" && nx && nx.t === "+") { changes.push(`Değiştirildi: "${g.v.join(" ")}" → "${nx.v.join(" ")}"`); i++; }
    else changes.push(`${g.t === "-" ? "Çıkarıldı" : "Eklendi"}: "${g.v.join(" ")}"`);
  }
  return changes;
}

function mvCompare(){
  const box = $("#mvbody");
  const canFiles = allowed("optimus"), canAI = allowed(TASK_MIN.degisiklik);
  const up = id => `<label class="btn btn-ghost small ${canFiles ? "" : "locked"}" style="margin:0;padding:6px 12px;min-height:0">📄 Dosyadan<input id="${id}" type="file" accept=".udf,.eyp,.pdf,.docx,.txt" class="hidden" ${canFiles ? "" : "disabled"}></label>`;
  box.innerHTML = `
    <p class="muted small" style="margin:10px 0 0">İki metin arasındaki farkı kelime kelime gösterir: <del>çıkarılan</del> · <ins>eklenen</ins>. Kanunun eski ve yeni hâli, sözleşmenin iki versiyonu veya iki dilekçe için kullanabilirsiniz. Farkları bilgisayar hesaplar; yapay zekâ yalnızca isterseniz açıklama yapar.</p>
    <div class="row" style="justify-content:space-between;align-items:end;margin-top:12px"><label for="old" style="margin:0">Eski metin</label>${up("fOld")}</div>
    <textarea id="old" placeholder="Eski metni yapıştırın (ör. değişiklik kanunundan veya eski baskıdan)…">${esc(state.mvOld || "")}</textarea>
    <div class="row" style="justify-content:space-between;align-items:end;margin-top:12px"><label for="new" style="margin:0">Yeni metin</label>${up("fNew")}</div>
    <textarea id="new" placeholder="Yeni metni yapıştırın…">${esc(state.mvNew || "")}</textarea>
    ${canFiles ? "" : `<p class="muted small" style="margin:6px 0 0">Dosyadan okuma Optimus ve üzeri paketlerde kullanılabilir.</p>`}
    <div id="m" class="hidden"></div>
    <button class="btn btn-primary btn-block" id="dgo">Farkları göster</button>
    <div id="dout"></div>`;
  const keep = () => { state.mvOld = $("#old").value; state.mvNew = $("#new").value; };
  $("#old").oninput = keep; $("#new").oninput = keep;
  const load = (inp, ta) => { $(inp).onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { $(ta).value = (await fileText(f.name, await f.arrayBuffer())).trim(); keep(); }
    catch (err) { showMsg($("#m"), err.message); }
  }; };
  load("#fOld", "#old"); load("#fNew", "#new");
  $("#dgo").onclick = () => {
    $("#m").classList.add("hidden");
    const o = $("#old").value.trim(), n = $("#new").value.trim();
    if (!o || !n) return showMsg($("#m"), "Karşılaştırmak için iki metni de girin.");
    if (o.length + n.length > 400000) return showMsg($("#m"), "Metinler çok uzun. Lütfen ilgili maddeleri veya bölümleri karşılaştırın.");
    const g = wordDiff(o, n);
    const del = g.filter(x => x.t === "-").reduce((s, x) => s + x.v.length, 0);
    const ins = g.filter(x => x.t === "+").reduce((s, x) => s + x.v.length, 0);
    const changes = diffSummary(g);
    $("#dout").innerHTML = `<div class="card" style="margin-top:14px">
      <h3>Sonuç</h3>
      ${changes.length ? `<p class="small"><b>${changes.length}</b> değişiklik · <del>${del} kelime çıkarıldı</del> · <ins>${ins} kelime eklendi</ins></p>
        <div class="doc diff">${diffHtml(g)}</div>
        <div class="row"><button class="btn btn-ghost" id="dcp">Değişiklik listesini kopyala</button>
          <button class="btn btn-gold ${canAI ? "" : "locked"}" id="dai" ${canAI ? "" : "disabled"}>🤖 Değişikliği yapay zekâ ile açıkla</button></div>
        ${canAI ? "" : `<p class="muted small">Yapay zekâ açıklaması ${PLAN_NAME[TASK_MIN.degisiklik]} ve üzeri paketlerde kullanılabilir.</p>`}
        <div id="dm" class="hidden"></div><div id="daiout" class="hidden card out" style="margin-top:14px"></div>`
      : `<p class="msg ok">İki metin aynı; kelime farkı yok.</p>`}</div>`;
    const cp = $("#dcp"); if (cp) cp.onclick = e => copy(changes.map((c, i) => `${i + 1}. ${c}`).join("\n"), e.target);
    const ai = $("#dai");
    if (ai && canAI) ai.onclick = async () => {
      busy(ai, true, "Yapay zekâ çalışıyor…"); $("#dm").classList.add("hidden");
      const text = `ESKİ METİN:\n${o}\n\nYENİ METİN:\n${n}\n\nOTOMATİK TESPİT EDİLEN FARKLAR:\n` + changes.slice(0, 60).map((c, i) => `${i + 1}. ${c}`).join("\n");
      try { await streamAI({ task: "degisiklik", text }, $("#daiout")); }
      catch (err) { showMsg($("#dm"), err.message); }
      finally { busy(ai, false); }
    };
    $("#dout").scrollIntoView({ behavior: "smooth" });
  };
}

function outcomeOf(text){
  const t = trLower(String(text || "").slice(-2500)); let best = ["belirsiz", "Belirlenemedi", -1];
  [["ihlal_yok", /ihlal\s+edilmediğine/g, "İhlal yok"], ["ihlal", /ihlal\s+edildiğine/g, "İhlal"], ["bozma", /bozulmasına|bozmaya/g, "Bozma"],

        const mm = re.exec(law.full);
        if (mm) { const rest = law.full.slice(mm.index + mm[0].length); const end = rest.search(/\n[^\n]{0,40}?(?:MADDE|Madde)\s+\d+(?:\s*\/\s*[A-Za-z])?\s*[-–—]/); a = { text: (mm[0] + (end > 0 ? rest.slice(0, end) : rest.slice(0, 3000))).trim(), heading: "" }; }

      if (x.kw && !nrm(raw + " " + (a.heading || "")).includes(nrm(x.kw))) { x.status = "uyumsuz"; x.on = false; continue; }

// Yapay zekâya giden metin: taraf, vekil, tanık adları ve 🔒 alanlar YOK (yer tutucuyla yazılır, telefonda doldurulur)
// Olay / talep / konu metnindeki kişi adlarını gönderimden önce maskele (telefonda geri doldurulur)
function dlMask(t){
  const d = state.dl, kb = kbOf(d.tur); let s = String(t || "");
  const esc2 = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const swap = (val, ph) => { val = String(val || "").trim(); if (val.length >= 3) s = s.replace(new RegExp("(^|[^A-Za-zÇĞİÖŞÜçğıöşü])" + esc2(val) + "(?![A-Za-zÇĞİÖŞÜçğıöşü])", "gi"), (m, p1) => p1 + ph); };
  kb.alanlar.filter(a => a[3]).forEach(([id]) => swap(d.ozel[id], `{{X_${id.toUpperCase()}}}`));
  const names = (txt, ph) => String(txt || "").split(/\n+/).forEach(line => {
    const nm = line.split(/[,(\-–]|T\.?C\.?/)[0].replace(/^\s*Av\.?\s*/i, "").trim();
    if (/müdürlüğü|bakanlığı|belediye|başkanlığı|valiliği|kaymakamlığı|hazine|kurumu|bankası|sigorta|a\.?ş\.?|ltd|şti|şirketi|derneği|vakfı|üniversitesi|odası/i.test(line)) return;   // kurum adları kişisel veri değildir
    if (nm.split(/\s+/).length >= 2 && nm.length <= 60) { swap(nm, ph); nm.split(/\s+/).filter(w => w.length >= 3 && /^[A-ZÇĞİÖŞÜ]/.test(w) && !/^(İl|İlçe|Nüfus|Müdürlüğü|Bakanlığı|Belediyesi|Başkanlığı|Ltd|Şti|A\.?Ş\.?)$/i.test(w)).forEach(w => swap(w, ph)); }
  });
  names(d.davaci, "müvekkil"); names(d.davali, "davalı"); names(d.taniklar, "tanık");
  return s;
}
function dlCompose(forPetition, sorunlar){
  const d = state.dl, kb = kbOf(d.tur);
  const ok = (d.facts ? d.facts.items : []).filter(x => x.ok);
  const per = forPetition ? (ok.length > 5 ? 1400 : 2200) : (ok.length > 5 ? 1600 : 2400);
  const kararlar = ok.map(x => `- ${x.kunye}\n  Mahkeme düzeyi: ${x.level.label} · Sonuç (otomatik): ${x.outcome.label}\n  Alıntı:\n${String(x.excerpt || "").slice(-per)}`).join("\n\n");
  const cnt = {}; ok.forEach(x => cnt[x.outcome.label] = (cnt[x.outcome.label] || 0) + 1);
  const ozel = kb.alanlar.map(([id, label, , yerel]) => { const v = String(d.ozel[id] || "").trim(); return `- ${label}: ${yerel ? (v ? `{{X_${id.toUpperCase()}}}` : "[verilmedi]") : (dlMask(fixTypos(v)) || "[verilmedi]")}`; }).join("\n");
  const mev = dlMevOn().map(x => `- ${mevLabel(x)}${x.konu ? ` (${x.konu})` : ""}${x.text ? `:\n${x.text.slice(0, forPetition ? 900 : 1100)}` : " — metin alınamadı; yalnızca konusuyla kullan"}`).join("\n");
  const arab = kb.arab || (d.ozel.arab && d.ozel.arab.trim());
  return `DAVA TÜRÜ: ${kb.id === "diger" ? "Diğer" : kb.ad}\nGÖREVLİ MAHKEME: ${kb.mahkeme || "-"}\n` +
    `DAVA KONUSU (avukatın yazdığı): ${dlMask(fixTypos(d.konu.trim())) || "-"}\n${kb.konu ? `KONU KALIBI (örnek): ${kb.konu}\n` : ""}` +
    `DAVA DEĞERİ: ${d.deger.trim() ? "belirtildi" : "belirtilmedi"}\nDAVALI SAYISI: ${d.davali.trim() ? d.davali.trim().split(/\n+/).filter(Boolean).length : "belirtilmedi"}\nTANIK: ${d.taniklar.trim() ? "var (telefonda eklenecek)" : "yok"}\n\n` +
    (ozel ? `TÜRE ÖZEL BİLGİLER:\n${ozel}\n\n` : "") +
    `OLAY:\n${dlMask(fixTypos(d.olay.trim()))}\n\nTALEP:\n${dlMask(fixTypos(d.talep.trim())) || "-"}\n\nDELİLLER:\n${d.deliller.trim() || kb.delil || "-"}\n\n` +
    (arab ? `ARABULUCULUK: ${kb.arab ? kb.arab.d + " uyarınca dava şartı. " : ""}Son tutanak bilgisi: ${(d.ozel.arab || "").trim() || "[verilmedi]"}\n\n` : "") +
    `MEVZUAT (yalnızca bunlara dayan):\n${mev || "- seçilmedi; madde numarası yazma, 'ilgili mevzuat' de"}\n\n` +
    (kb.istem.length ? `STANDART İSTEMLER:\n${kb.istem.map((x, i) => `${i + 1}- ${x}`).join("\n")}\n\n` : "") +
    `SAYIM: ${ok.length} karar${ok.length ? "; " + Object.entries(cnt).map(([k, v]) => `${k}: ${v}`).join(", ") : ""}\n\nSEÇİLEN KARARLAR:\n${kararlar || "- yok (karara atıf yapma)"}` +
    (forPetition && d.analiz ? `\n\nDAVA ANALİZİ:\n${d.analiz.slice(0, 3500)}` : "") +
    (sorunlar && sorunlar.length ? `\n\nÖNCEKİ TASLAKTA BULUNAN SORUNLAR (bu sefer bunları yapma):\n${sorunlar.map(s => "- " + s).join("\n")}` : "");
}
// Yazım hatası düzeltme (sunucudakiyle aynı): "izalei şuur" → "izale-i şuyu"
const fixTypos = t => String(t || "").replace(/izale[\s\-]*[iı]?[\s\-]*ş[uü]y?[uü]r?\b/gi, "izale-i şuyu").replace(/ortaklı[gğ]ın gider[iı]lmes[iı]/gi, "ortaklığın giderilmesi");
// Görevli mahkeme kontrolü (yalnızca uyarı)
const GOREV = [
  [/^Ortaklığın/, /sulh hukuk/, "Ortaklığın giderilmesi davalarında görevli mahkeme Sulh Hukuk Mahkemesidir (HMK m.4/1-b)."],
  [/^Kira/, /sulh hukuk/, "Kira ilişkisinden doğan davalarda görevli mahkeme Sulh Hukuk Mahkemesidir (HMK m.4/1-a)."],
  [/^(İşçilik|İşe iade)/, /iş mahkemesi|asliye hukuk/, "İşçi-işveren uyuşmazlıklarında görevli mahkeme İş Mahkemesidir (7036 s.K. m.5); iş mahkemesi olmayan yerde Asliye Hukuk bu sıfatla bakar."],
  [/^Aile/, /aile mahkemesi|asliye hukuk/, "Aile hukukundan doğan davalarda görevli mahkeme Aile Mahkemesidir (4787 s.K. m.4); olmayan yerde Asliye Hukuk bu sıfatla bakar."],
  [/^Tüketici/, /tüketici|asliye hukuk/, "Tüketici işlemlerinden doğan davalarda görevli mahkeme Tüketici Mahkemesidir (6502 s.K. m.73)."],
  [/^Ticari/, /ticaret/, "Ticari davalarda görevli mahkeme Asliye Ticaret Mahkemesidir (TTK m.5)."],
  [/^Nüfus/, /asliye hukuk/, "Ad değişikliği ve nüfus kaydının düzeltilmesi davalarında görevli mahkeme Asliye Hukuk Mahkemesidir."],
  [/^İdari/, /idare/, "İdari işlemlere karşı davalar İdare Mahkemesinde açılır."], [/^Vergi/, /vergi/, "Vergi uyuşmazlıkları Vergi Mahkemesinde açılır."],
];
function gorevUyari(d){
  const g = GOREV.find(([t]) => t.test(d.tur)); if (!g || !d.mahkeme.trim()) return "";
  return trLower(d.mahkeme).match(g[1]) ? "" : `⚖️ <b>Görev kontrolü:</b> ${g[2]} Yazdığınız mahkemeyi kontrol edin.`;
}
// Mahkeme adı: "Niğde asliye hukuk" → "NİĞDE ASLİYE HUKUK MAHKEMESİ"
function mahkemeAdi(raw){
  let m = String(raw || "").trim().replace(/\s+/g, " ").toLocaleUpperCase("tr-TR").replace(/['’]?\s*N[EA]$/, "").replace(/\s+BAŞKANLIĞI$/, "");
  if (!m) return "";
  if (!/(MAHKEMES[İI]|H[ÂA]K[İI]ML[İI]Ğ[İI]|BAŞSAVCILIĞI|DA[İI]RES[İI]|KURULU|BAŞKANLIĞI|MÜDÜRLÜĞÜ)$/.test(m)) m += " MAHKEMESİ";
  return m;
}
const yonelme = m => /[IAOU]$|[IAOU][^AEIİOÖUÜ]*$/.test(m.replace(/[^A-ZÇĞİÖŞÜ]/g, "").slice(-3)) && !/[EİÖÜ][^AEIİOÖUÜ]*$/.test(m) ? "'NA" : "'NE";
// Başlık: "… MAHKEMESİ BAŞKANLIĞI'NA"; mahkeme yazılmadıysa görevli mahkemenin nöbetçisi
function mahkemeBaslik(){
  const d = state.dl, kb = kbOf(d.tur);
  let m = mahkemeAdi(d.mahkeme);
  if (!m) m = kb.mahkeme ? `NÖBETÇİ ${kb.mahkeme.split(" / ")[0].toLocaleUpperCase("tr-TR")} MAHKEMESİ` : "[MAHKEME ADI]";
  return /MAHKEMES[İI]$/.test(m) ? m + " BAŞKANLIĞI'NA" : m + yonelme(m);
}
// Yer tutucuları telefondaki bilgilerle doldur
function dlFill(text){
  const d = state.dl;
  const v = { DAVACI: d.davaci.trim() || "[Davacı ad soyad, T.C. kimlik no, adres]", DAVACI_VEKILI: d.vekil.trim() || "[Vekil ad soyad, baro sicil no, adres]",
    DAVALI: d.davali.trim() || "[Davalı ad soyad, adres]", DAVA_DEGERI: d.deger.trim() || "[ ]", TARIH: new Date().toLocaleDateString("tr-TR"), MAHKEME: mahkemeBaslik().replace(/ BAŞKANLIĞI'NA$|'N[EA]$/, "") };
  Object.entries(d.ozel || {}).forEach(([k, val]) => v["X_" + k.toUpperCase()] = String(val || "").trim() || "[ ]");
  return String(text || "").replace(/\{\{\s*([A-ZÇĞİÖŞÜ_]+)\s*\}\}/g, (m, k) => v[k] !== undefined ? v[k] : "[ ]");
}
// Yapay zekâ gövdesini temizle: başlık/imza/ek tekrarlarını ve [1] gibi sıra numaralarını at
function dlCleanBody(t){
  let s = String(t || "").replace(/\r/g, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,4}\s*/gm, "");
  const k = s.search(/^\s*KONUSU?\s*:/m); if (k > 0) s = s.slice(k);
  const n = s.search(/^\s*NET[İI]CE VE TALEP/m);
  if (n >= 0) { const after = s.slice(n); const cut = after.search(/\n\s*(EKLER\s*:?|Davacı Vekili|\{\{\s*TARIH|Saygılarımızla\s*$)/m); if (cut > 0) s = s.slice(0, n) + after.slice(0, cut); }
  s = s.replace(/[ \t]*\[(\d{1,2})\]/g, "").replace(/^KONU\s*:/m, "KONUSU :").replace(/[ \t]+$/gm, "").replace(/\n{3,}/g, "\n\n").trim();
  return s;
}
// Tam dilekçe: başlık + taraflar (telefonda) + gövde (yapay zekâ) + tanıklar + tarih/imza + ekler
function dlAssemble(){
  const d = state.dl, kb = kbOf(d.tur);
  const pad = l => (l + " ".repeat(14)).slice(0, 14) + ": ";
  const davalilar = d.davali.trim() ? d.davali.trim().split(/\n+/).map(x => x.trim()).filter(Boolean) : ["[Davalı ad soyad / kurum, adres]"];
  const head = [mahkemeBaslik(), "",
    pad("DAVACI") + (d.davaci.trim() || "[Davacı ad soyad, T.C. kimlik no, adres]"),
    pad("VEKİLİ") + (d.vekil.trim() || "[Av. ad soyad, baro sicil no, adres]"),
    pad("DAVALI") + davalilar.join("\n" + " ".repeat(16)),
    ...(d.deger.trim() ? [pad("DAVA DEĞERİ") + d.deger.trim()] : []), ""].join("\n");
  let body = dlFill(dlCleanBody(d.dilekce));
  const tan = d.taniklar.trim() ? d.taniklar.trim().split(/\n+/).map((x, i) => `${i + 1}- ${x.trim()}`).join("\n") : "";
  if (tan) {
    const at = body.search(/^\s*HUKUK[İI] NEDENLER/m);
    body = at >= 0 ? body.slice(0, at).trimEnd() + `\n\nTANIKLAR :\n${tan}\n\n` + body.slice(at).trimStart() : body + `\n\nTANIKLAR :\n${tan}`;
  }
  const vekilAd = (d.vekil.split(",")[0] || "").trim() || "Av. [ ]";
  const ekler = (d.ekler || dlDefaultEkler()).split(/\n+/).map(x => x.replace(/^\s*\d+\s*[-.)]+\s*/, "").trim()).filter(Boolean);
  return `${head}\n${body}\n\n${new Date().toLocaleDateString("tr-TR")}\nDavacı Vekili\n${vekilAd}\n(imza)` + (ekler.length ? `\n\nEKLER :\n${ekler.map((x, i) => `${i + 1}- ${x}`).join("\n")}` : "");
}
function dlDefaultEkler(){ const kb = kbOf(state.dl.tur); return kb.ekler.join("\n"); }

// ---------- Otomatik kalite kontrolü ----------
function dlQA(){
  const d = state.dl, kb = kbOf(d.tur), body = dlCleanBody(d.dilekce), full = dlAssemble();
  const out = [];   // [seviye, mesaj, yapay zekâya iletilecek mi]
  const SECS = ["KONUSU", "AÇIKLAMALAR", "HUKUKİ NEDENLER", "HUKUKİ DELİLLER", "NETİCE VE TALEP"];
  const missing = SECS.filter(s => !new RegExp("^\\s*" + s.replace("İ", "[İI]") + "\\s*:?", "mi").test(body));
  out.push(missing.length ? ["err", `Eksik bölüm: ${missing.join(", ")}`, true] : ["ok", "Bütün bölümler var (Konusu, Açıklamalar, Hukuki Nedenler, Deliller, Netice ve Talep)"]);
  // künye kontrolü: yalnızca seçilen kararlar
  const known = (d.facts ? d.facts.items : []).filter(x => x.ok).flatMap(x => [x.esas, x.karar, ...(String(x.kunye).match(/\d{4}\/\d+/g) || [])]).filter(Boolean);
  const cited = [...new Set((body.match(/\b(?:E\.|Esas)\s*:?\s*(\d{4}\/\d+)/gi) || []).map(x => x.match(/\d{4}\/\d+/)[0]))];
  const bad = cited.filter(c => !known.includes(c));
  out.push(bad.length ? ["err", `Seçilen kararlar arasında olmayan künye: ${bad.join(", ")} — silin veya kontrol edin`, true]
    : cited.length ? ["ok", `${cited.length} karara atıf var; hepsi seçilen kararlardan`] : ["info", (known.length ? "Seçilen kararlara atıf yapılmamış" : "Karar seçilmediği için emsal atıf yok")]);
  // kanun maddesi kontrolü
  const allowed = new Set(dlMevOn().map(x => (x.no + ":" + normMadde(x.m))));
  const abbr = Object.fromEntries(Object.entries(KANUN_KISA_C).map(([k, v]) => [k, v]));
  // "TMK m.688, 698 ve 699" gibi listeler de tek tek kontrol edilir
  const cites = [];
  for (const m of body.matchAll(/(?<![A-Za-zÇĞİÖŞÜçğıöşü])(TMK|TBK|HMK|İİK|TTK|KTK|TKHK|HUAK|İYUK|İş K\.?|İş Kanunu)\s*(?:m\.|md\.|madde)?\s*((?:\d{1,4}(?:\/[A-ZÇĞİÖŞÜ])?(?:\/\d+(?:-[a-zçğıöşü])?)?(?:\s*(?:,|ve)\s*(?=\d))?)+)/g))
    for (const part of m[2].split(/\s*(?:,|ve)\s*/)) { const n = (/^\d{1,4}(?:\/[A-ZÇĞİÖŞÜ](?![a-zçğıöşü]))?/.exec(part.trim()) || [])[0]; if (n) cites.push([m[0], m[1], n]); }
  const unk = [...new Set(cites.filter(m => { const no = abbr[trLower(m[1]).replace(/ı/g, "i").replace(/ş/g, "s").replace(/[.\s]+/g, " ").trim()]; return no && !allowed.has(no + ":" + normMadde(m[2])); }).map(m => `${m[1]} m.${m[2]}`))];
  if (unk.length) out.push(["warn", `Mevzuat listesinde işaretli olmayan madde: ${unk.join(", ")} — doğruluğunu kontrol edin`, true]);
  else if (cites.length) out.push(["ok", "Atıf yapılan maddeler mevzuat listesinden"]);
  // tekrar
  const sents = body.split(/(?<=[.;])\s+/).map(x => trLower(x).replace(/[^a-zçğıöşü0-9 ]/g, "").replace(/\s+/g, " ").trim()).filter(x => x.length > 50);
  const dup = sents.filter((x, i) => sents.indexOf(x) !== i);
  if (dup.length) out.push(["warn", `${dup.length} cümle tekrar ediyor`, true]);
  // niyet bildiren ifade
  if (/istemektedir|açmak istiyor/i.test(body)) out.push(["warn", "'… istemektedir' gibi niyet bildiren ifade var; dilekçe dili değil", true]);
  if (!/ibarettir/i.test((body.match(/^\s*KONUSU?\s*:.*$/m) || [""])[0] + body.slice(0, 600))) out.push(["info", "Konusu bölümü '… talebinden ibarettir' kalıbıyla bitmiyor"]);
  // arabuluculuk
  if (kb.arab) {
    const inBody = /arabulucu/i.test(body), inEk = /arabulucu/i.test(d.ekler || dlDefaultEkler());
    out.push(inBody && inEk ? ["ok", "Arabuluculuk dava şartı açıklamalarda ve eklerde var"] : ["err", `Dava şartı arabuluculuk ${inBody ? "eklerde" : "açıklamalarda"} yok (${kb.arab.d})`, !inBody]);
    if (!String(d.ozel.arab || "").trim()) out.push(["warn", "Arabuluculuk son tutanağı bilgisi girilmedi (1. adım)"]);
  }
  // taraflar
  if (!d.davaci.trim() || !d.davali.trim()) out.push(["warn", "Davacı veya davalı bilgisi eksik (1. adım)"]);
  if (!d.mahkeme.trim()) out.push(["info", `Mahkeme yazılmadı; başlık "${mahkemeBaslik()}" olarak kuruldu`]);
  // doldurulacak yerler
  const blanks = (full.match(/\[ *\]|…|\[[^\]\n]{2,60}\]/g) || []).length;
  if (blanks) out.push(["info", `${blanks} yer doldurulmayı bekliyor ([ ] ve … ile işaretli)`]);
  return out;
}

function dlStep4(){
  const d = state.dl, box = $("#dlbody");
  if (!d.ekler) d.ekler = dlDefaultEkler();
  box.innerHTML = `<p class="muted small" style="margin:6px 0 0">4. Gövde metnini yapay zekâ yazar; mahkeme başlığı, taraflar, tanıklar, tarih, imza ve ekler telefonunuzda eklenir. Taslak yalnızca seçilen mevzuat ve kararlara dayanır, ardından otomatik kontrolden geçer.</p>
    ${!d.davaci.trim() || !d.davali.trim() ? `<div class="notice">Davacı veya davalı bilgisi eksik. <a href="#" id="dto1">1. adıma dönüp doldurun</a>; taslak kendiliğinden güncellenir, yeniden yazdırmanız gerekmez.</div>` : ""}

      ${qa.map(([l, t]) => `<div class="small" style="margin:4px 0;color:${l === "err" ? "var(--err)" : l === "ok" ? "var(--ok)" : "inherit"}">${icon[l]} ${esc(t)}</div>`).join("")}
      ${fixable.length ? `<button class="btn btn-primary btn-block" id="dfix" style="margin-top:8px">🔧 Bu sorunları düzelterek yeniden yaz</button>` : ""}
      <p class="muted small" style="margin:8px 0 0">Kontrol bilgisayarca yapılır. Mevzuat atıflarını ve kararların kesinleşme durumunu yine de kontrol edin.</p></div>`;
    const fx = $("#dfix"); if (fx) fx.onclick = () => write(fixable.map(x => x[1]));
  };
  const write = async sorunlar => {

      d.dilekce = await streamAI({ task: "dilekce_yaz", text: dlCompose(true, sorunlar) }, out);

    finally { busy(btn, false); if (d.dilekce) render(); }
  };
  if (d.dilekce) render();
  [$("#dto1"), $("#dto1b")].forEach(a => { if (a) a.onclick = e => { e.preventDefault(); d.step = 1; tabDilekce(); }; });

  $("#ddocx").onclick = async () => { try { await downloadDocx(dlAssemble(), "dilekce-taslagi.docx"); } catch (err) { showMsg($("#m"), "Word dosyası oluşturulamadı: " + err.message); } };
  $("#dnew").onclick = () => { if (!confirm("Yeni dilekçe başlatılsın mı? Bu taslak 📂 Önceki dilekçeler listesinde kalır.")) return; dlReset(); };
}

// Gerçek .docx (Word) dosyası: JSZip ile en küçük geçerli Word belgesi oluşturulur
async function downloadDocx(text, filename){
  await loadScript(LIB.jszip);
  const x = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const paras = String(text || "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,4}\s*/gm, "").split("\n").map(line => {
    const bold = /^[A-ZÇĞİÖŞÜ0-9 .,:()\/\-]{4,}$/.test(line.trim()) && /[A-ZÇĞİÖŞÜ]/.test(line);
    return `<w:p><w:pPr><w:spacing w:after="120" w:line="360" w:lineRule="auto"/>${bold ? '<w:jc w:val="left"/>' : '<w:jc w:val="both"/>'}</w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${bold ? "<w:b/>" : ""}<w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${x(line)}</w:t></w:r></w:p>`;
  }).join("");
  const zip = new window.JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);

// ---------- arama yardımcıları: çoklu ifade, vurgulama, geçmiş ----------
function splitPhrasesClient(q){ return String(q || "").split(/\s*[+,]\s*|\s+[-–]\s+/).map(x => x.trim().replace(/^"|"$/g, "")).filter(x => x.length >= 2).slice(0, 4); }
// Vurgulanacak terimler: çoklu ifadede ifadelerin kendisi, tek ifadede 4+ harfli kelimeler
function hlTerms(q){
  q = String(q || "").trim(); const ph = splitPhrasesClient(q);
  if (ph.length > 1 || /^".+"$/.test(q)) return ph;
  return ph.length ? ph[0].split(/\s+/).filter(w => w.length >= 4) : [];
}
function highlightPhrases(text, phrases){
  const src = String(text || ""); const low = trLower(src);
  const ranges = [];
  (phrases || []).map(trLower).filter(p => p.length >= 2).forEach(p => {
    let i = 0, n = 0; while ((i = low.indexOf(p, i)) >= 0 && n < 400) { ranges.push([i, i + p.length]); i += p.length; n++; }
  });
  if (!ranges.length) return esc(src);
  ranges.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [s, e] of ranges) { if (s < pos) continue; out += esc(src.slice(pos, s)) + "<mark>" + esc(src.slice(s, e)) + "</mark>"; pos = e; }
  return out + esc(src.slice(pos));
}
const histKey = () => "hp_hist_" + ((state.user && state.user.id) || "x");

function addHist(q, source, cfg){
  const h = getHist().filter(x => !(x.q === q && x.s === source && x.c === cfg));
  h.unshift({ q, s: source, c: cfg, t: Date.now() });
  try { localStorage.setItem(histKey(), JSON.stringify(h.slice(0, 20))); } catch {}
}
function clearHist(){ try { localStorage.removeItem(histKey()); } catch {} }

const D = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
const iso = d => d.toISOString().slice(0, 10);
const trDate = d => d.toLocaleDateString("tr-TR", { timeZone: "UTC", day: "2-digit", month: "long", year: "numeric", weekday: "long" });

  cmk: "Ceza (CMK m.331/4: tatilin bittiği günden itibaren 3 gün uzar)", iyuk: "İdari / vergi (İYUK: ara vermenin bittiği günü izleyen tarihten itibaren 7 gün uzar)",
  iik: "İcra (İİK: adli tatil süreleri uzatmaz)", yok: "Adli tatil uygulanmasın" };
function sureHesapla(baslangic, miktar, birim, rejim){
  const start = D(baslangic); const notes = [];
  let end;
  if (birim === "gun") end = addDays(start, miktar);                 // başladığı gün sayılmaz (HMK m.92/1)
  else if (birim === "hafta") end = addDays(start, miktar * 7);      // başladığı güne karşılık gelen gün (HMK m.92/2)
  else {
    const months = birim === "ay" ? miktar : miktar * 12;
    const y = start.getUTCFullYear(), m = start.getUTCMonth() + months, d = start.getUTCDate();
    const last = new Date(Date.UTC(y, m + 1, 0, 12)).getUTCDate();       // ayın son günü (31 Ocak + 1 ay = 28/29 Şubat)
    end = new Date(Date.UTC(y, m, Math.min(d, last), 12));
  }
  notes.push(`Süre ${trDate(start)} tarihinden itibaren işler; başladığı gün hesaba katılmaz. Ham bitiş: <b>${trDate(end)}</b>.`);
  if (inAdli(end) && rejim !== "yok" && rejim !== "iik") {
    const tatilSonu = D(end.getUTCFullYear() + "-08-31");
    const ext = rejim === "cmk" ? 3 : 7;
    end = addDays(tatilSonu, ext);
    notes.push(`Son gün adli tatile (20 Temmuz – 31 Ağustos) rastlıyor → ${ext} gün uzar: <b>${trDate(end)}</b>.`);
  } else if (inAdli(end) && rejim === "iik") notes.push("Son gün adli tatile rastlıyor; icra işlerinde adli tatil süreyi uzatmaz.");
  let moved = 0;
  while (isWeekend(end) || isHoliday(end)) { end = addDays(end, 1); moved++; if (moved > 15) break; }
  if (moved) notes.push(`Son gün hafta sonu / resmî tatile rastladığı için izleyen ilk iş gününe kaydı (HMK m.93): <b>${trDate(end)}</b>.`);
  const warn = [];
  if (isHalf(end)) warn.push("Son gün <b>arife veya yarım gün tatil</b>. Yarım günün süreye etkisi uygulamada tartışmalıdır; en güvenlisi işlemi o gün öğleden önce yapmaktır.");
  if (!TATIL[end.getUTCFullYear()]) warn.push(`${end.getUTCFullYear()} yılının resmî tatilleri araçta tanımlı değil; dinî bayramları ayrıca kontrol edin.`);
  return { end, notes, warn };
}

// ---- 2) Kıdem ve ihbar ----
const tavanAt = dt => { let v = null; for (const [s, x] of KIDEM_TAVAN) if (dt >= s) v = [s, x]; return v; };
function ihbarHafta(gun){ return gun < 182 ? 2 : gun < 547 ? 4 : gun < 1095 ? 6 : 8; }   // İş K. m.17: 6 ay / 1,5 yıl / 3 yıl
function kidemHesapla(giris, cikis, brut, ek, gvOran){
  const g = D(giris), c = D(cikis); const gun = daysBetween(g, c) + 1;
  const aylik = brut + ek;                       // giydirilmiş brüt ücret
  const tv = tavanAt(cikis);
  const esas = tv ? Math.min(aylik, tv[1]) : aylik;
  const kidemBrut = esas * gun / 365;
  const damga = 0.00759;
  const kidemNet = kidemBrut * (1 - damga);       // kıdem tazminatı gelir vergisinden istisnadır
  const hafta = ihbarHafta(gun);
  const ihbarBrut = aylik / 30 * hafta * 7;
  const ihbarGv = ihbarBrut * gvOran / 100, ihbarDv = ihbarBrut * damga;
  return { gun, yil: Math.floor(gun / 365), kalanGun: gun % 365, aylik, tv, esas, tavanUygulandi: tv && aylik > tv[1], kidemBrut, kidemDv: kidemBrut * damga, kidemNet,
           hafta, ihbarBrut, ihbarGv, ihbarDv, ihbarNet: ihbarBrut - ihbarGv - ihbarDv, eskiTarih: !tv, sonrasi: cikis > KIDEM_TAVAN_SON };
}

// ---- 3) Faiz (basit faiz, gün/365, oran değişiminde dönemlere bölünür) ----
function faizHesapla(ana, bas, bit, tablo){
  const b = D(bas), e = D(bit); const rows = []; let top = 0;
  for (let i = 0; i < tablo.length; i++) {
    const ps = D(tablo[i][0]), pe = i + 1 < tablo.length ? addDays(D(tablo[i + 1][0]), -1) : D("2100-01-01");
    const s = b > ps ? b : ps, f = e < pe ? e : pe;
    if (f < s) continue;
    const gun = daysBetween(s, f) + (s.getTime() === b.getTime() ? 0 : 1);
    if (gun <= 0) continue;
    const faiz = ana * tablo[i][1] / 100 * gun / 365; top += faiz;
    rows.push({ s, f, oran: tablo[i][1], gun, faiz });
  }
  return { rows, top, gun: daysBetween(b, e) };
}
